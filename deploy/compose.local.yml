# Explicit local override: no public listeners or ACME requests.
services:
  api:
    environment:
      APP_ENV: development
  migrate:
    environment:
      APP_ENV: development
  seed:
    environment:
      APP_ENV: development
  bootstrap:
    environment:
      APP_ENV: development
  caddy:
    environment:
      APP_DOMAIN: http://:8080
    ports: !override
      - "127.0.0.1:${LOCAL_HTTP_PORT:-4180}:8080"
